services:
  redpanda:
    # Use the widely available Redpanda image name
    image: redpanda/redpanda:latest
    container_name: redpanda
    command: ["redpanda", "start", "--overprovisioned", "--smp", "1", "--memory", "1G", "--reserve-memory", "0M", "--node-id", "0"]
    ports:
      - "9092:9092"
    volumes:
      - redpanda_data:/var/lib/redpanda/data
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster info || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5

volumes:
  redpanda_data: